farm_netatmo.settings:
  path: 'farm/settings/netatmo'
  defaults:
    _form: '\Drupal\farm_netatmo\Form\NetatmoSettingsForm'
    _title: 'Netatmo'
  requirements:
    _permission: 'administer farm settings'
  options:
    _admin_route: TRUE

farm_netatmo.authorize:
  path: 'farm/settings/netatmo/authorize'
  defaults:
    _controller: '\Drupal\farm_netatmo\Controller\AuthorizationController::authorize'
  requirements:
    _permission: 'administer farm settings'

farm_netatmo.callback:
  path: 'farm/netatmo/oauth/callback'
  defaults:
    _controller: '\Drupal\farm_netatmo\Controller\AuthorizationController::callback'
  requirements:
    _access: 'TRUE'
