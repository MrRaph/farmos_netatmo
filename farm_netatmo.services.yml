services:
  farmos_netatmo.netatmo_service:
    class: Drupal\farmos_netatmo\NetatmoService
    arguments:
      - '@http_client'
      - '@keyvalue.expirable'
      - '@logger.factory'
      - '@config.factory'
      - '@plugin.manager.data_stream_type'
    tags:
      - { name: needs_destruction }

  farmos_netatmo.authorization_controller:
    class: Drupal\farmos_netatmo\Controller\AuthorizationController
    arguments:
      - '@farmos_netatmo.netatmo_service'

  farmos_netatmo.drush_commands:
    class: Drupal\farmos_netatmo\Commands\FarmNetatmoCommands
    arguments:
      - '@farmos_netatmo.netatmo_service'
      - '@entity_type.manager'
    tags:
      - { name: drush.command }
