services:
  farm_netatmo.netatmo_service:
    class: Drupal\farm_netatmo\NetatmoService
    arguments:
      - '@http_client'
      - '@keyvalue.expirable'
      - '@logger.factory'
      - '@config.factory'
      - '@plugin.manager.data_stream_type'
      - '@entity_type.manager'
    tags:
      - { name: needs_destruction }

  farm_netatmo.authorization_controller:
    class: Drupal\farm_netatmo\Controller\AuthorizationController
    arguments:
      - '@farm_netatmo.netatmo_service'

  farm_netatmo.drush_commands:
    class: Drupal\farm_netatmo\Commands\FarmNetatmoCommands
    arguments:
      - '@farm_netatmo.netatmo_service'
      - '@entity_type.manager'
    tags:
      - { name: drush.command }
